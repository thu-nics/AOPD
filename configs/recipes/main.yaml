entrypoint: examples/agentic_opd/run_mixed_agentic_opd.sh
environment:
  AWM_PER_STEP: 59
  ENVSCALER_PER_STEP: 5
  TRAIN_BATCH: 64
  TRAIN_STEPS: 100
  PPO_MINI_BATCH: 32
  MAX_MODEL_LEN: 32000
  MAX_PROMPT_LENGTH: 27904
  MAX_RESPONSE_LENGTH: 4096
  FREQUENCY_BONUS_SCALE: 0.5
  SHUFFLE: false
  USE_RAW_SPLIT: 0
  MANAGE_AWM_SERVER: 1
  TEST_FREQ: -1
  VAL_BEFORE_TRAIN: false
  SAVE_FREQ: 10
  RESUME_MODE: disable
