entrypoint: examples/tau_bench/train/run.sh
environment:
  METHOD: agentic_opd
  TAU_ABLATION: full
  TAU_TEACHER_SOURCE: external
  TAU_USE_PRIVILEGED_TEACHER_CONTEXT: false
  AIRLINE_TRAJ: 8
  RETAIL_TRAJ: 8
  TELECOM_TRAJ: 8
  TRAIN_STEPS: 50
  TRAIN_MAX_STEPS: 20
  ROLLOUT_N: 4
  PPO_MINI_BATCH: 32
  MAX_PROMPT: 24576
  MAX_RESPONSE: 4096
  MAX_MODEL_LEN: 32768
  LR: 1.0e-6
  WARMUP_STEPS: 0
  FREQUENCY_BONUS_SCALE: 0.5
  STATE_GROUP_ADVANTAGE_MODE: mean_then_batch_whiten
  COMPACT_STATE_GROUP_ROWS: true
  TEST_FREQ: -1
  VAL_BEFORE_TRAIN: false
  SAVE_FREQ: 10
  RESUME_MODE: disable
