defaults:
  - ppo_trainer
  - _self_

# VPR Sokoban — one-box search-based process reward.

env:
  env_name: vpr_sokoban
  history_length: 0
  max_steps: 15
  invalid_penalty: -2.0
  sokoban:
    dim_room: [6, 6]
    num_boxes: 1
    search_depth: 30
    mode: tiny_rgb_array
    reward_mode: oracle
    oracle_reward: 2.0
    legal_non_oracle_reward: 0.0
    reward_noise_prob: 0.0
  rollout:
    mode: state_group
    selection_mode: mixed
    random_select_prob: 0.0
    random_select_prob_schedule: ""
  resources_per_worker:
    num_cpus: 0.1
    num_gpus: 0

algorithm:
  adv_estimator: vpr
  state_group:
    advantage_mode: mean_then_batch_whiten
    normalization_scope: batch
    equal_reward_eps: 1.0e-8
    min_candidates: 2
    min_effective_groups: 1
    compact_policy_rows: true
  vpr:
    outcome_reward_scale: 0.0
