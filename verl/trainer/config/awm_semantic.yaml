defaults:
  - ppo_trainer
  - _self_

data:
  # 32,000 total context = 29,952 prompt + 2,048 generated action.
  max_prompt_length: 29952
  max_response_length: 2048
  truncation: error
  train_batch_size: 8
  val_batch_size: 8
  return_raw_chat: true
  shuffle: false
  apply_chat_template_kwargs:
    enable_thinking: true

env:
  env_name: awm_semantic
  seed: 0
  max_steps: 20
  history_length: 0
  agentic_eval:
    native_action_protocol: true
    prompt_rendering: chatml
    action_format: tool_call
  awm:
    base_url: http://127.0.0.1:8000
    train_max_steps: 20
    eval_max_steps: 20
    eval_seed: 300
    history_window: 3
    verifier_mode: code
    reward_mode: semantic
    runtime_quarantine:
      enabled: true
      path: runs/awm/runtime_quarantine.jsonl
      protocol_version: 1
    oracle:
      model: deepseek-v4-flash
      api_key_env: DEEPSEEK_API_KEY
      samples: 3
      reasoning_effort: max
      max_tokens: 4096
      cache_path: runs/awm/cache/teacher.jsonl
      matcher_cache_path: runs/awm/cache/matcher.jsonl
      timeout_seconds: 300
      max_retries: 5
      max_concurrent_requests: 32
  rollout:
    n: 4
    mode: state_group
    selection_mode: best
    random_select_prob: 0.0
  resources_per_worker:
    num_cpus: 0.5
    num_gpus: 0

reward_model:
  reward_manager: turn

actor_rollout_ref:
  actor:
    entropy_coeff: 0.0
    log_entropy_metrics: false
    use_invalid_action_penalty: false
  rollout:
    n: 1
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    val_kwargs:
      do_sample: true
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      n: 1
      seed: 300
    max_model_len: 32000
    max_num_batched_tokens: 32000
    multi_turn:
      enable: true

algorithm:
  adv_estimator: dapo
  dapo_trajectory_level_advantage: false
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
    metric: acc
    max_num_gen_batches: 10
