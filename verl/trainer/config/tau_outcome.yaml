defaults:
  - ppo_trainer
  - _self_

env:
  env_name: tau_outcome
  seed: 0
  max_steps: 30
  history_length: 0
  agentic_eval:
    native_action_protocol: true
    prompt_rendering: chatml
    action_format: tool_call
  teacher_reward:
    mode: appearance
    # Weighted mode: 1 + scale * (count - 1) / (teacher_samples - 1).
    frequency_bonus_scale: 0.5
  tau:
    source_root: /mnt/public2/yuanhuining/repos/tau2-bench
    train_max_steps: 20
    eval_max_steps: 30
    eval_seed: 300
    user_llm: openai/qwen3.5-9b
    user_api_base: http://172.27.20.58:8000/v1
    user_api_key_env: TAU_USER_API_KEY
    user_temperature: 1.0
    user_top_p: 0.95
    user_top_k: 20
    user_min_p: 0.0
    user_presence_penalty: 1.5
    user_repetition_penalty: 1.0
    user_max_tokens: 8192
    user_reasoning_enabled: true
    user_generation_retries: 2
    trajectory_counts:
      airline: 5
      retail: 11
    validation_domains:
      - airline
      - retail
    validation_counts:
      airline: 5
      retail: 11
    validation_task_split: test
    validation_trials: 1
  rollout:
    n: 4
    mode: vanilla
    selection_mode: best
    random_select_prob: 0.0
  resources_per_worker:
    num_cpus: 0.5
    num_gpus: 0

reward_model:
  reward_manager: turn
  overlong_buffer:
    enable: false
    len: 2048
    penalty_factor: 1.0
    log: true

actor_rollout_ref:
  actor:
    use_invalid_action_penalty: false
  rollout:
    val_kwargs:
      do_sample: false
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      min_p: 0.0
      n: 1
      seed: 300

algorithm:
  adv_estimator: grpo
  # Sum terminal/turn rewards per episode before normalizing the four rollouts.
  dapo_trajectory_level_advantage: true
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
    metric: acc
    max_num_gen_batches: 10
