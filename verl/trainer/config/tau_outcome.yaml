defaults:
  - ppo_trainer
  - _self_

env:
  env_name: tau_outcome
  seed: 0
  max_steps: 30
  history_length: 0
  agentic_eval:
    native_action_protocol: true
    prompt_rendering: chatml
    action_format: tool_call
  tau:
    qualification_manifest: ???
    minimum_stable_airline: 20
    minimum_stable_retail: 50
    train_max_steps: 20
    eval_max_steps: 30
    eval_seed: 300
    user_llm: openrouter/qwen/qwen3.6-27b
    user_temperature: 0.0
    user_reasoning_enabled: false
    trajectory_counts:
      airline: 4
      retail: 4
    validation_counts:
      airline: 4
      retail: 4
  rollout:
    n: 4
    mode: vanilla
    selection_mode: best
    random_select_prob: 0.0
  resources_per_worker:
    num_cpus: 0.5
    num_gpus: 0

reward_model:
  reward_manager: turn
  overlong_buffer:
    enable: false
    len: 2048
    penalty_factor: 1.0
    log: true

actor_rollout_ref:
  actor:
    use_invalid_action_penalty: false

algorithm:
  adv_estimator: grpo
  # Sum terminal/turn rewards per episode before normalizing the four rollouts.
  dapo_trajectory_level_advantage: true
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
    metric: acc
    max_num_gen_batches: 10
