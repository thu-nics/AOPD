defaults:
  - ppo_trainer
  - _self_

data:
  # 32,000 total context = 27,904 prompt + 4,096 generated action.
  max_prompt_length: 27904
  max_response_length: 4096
  truncation: error
  train_batch_size: 64
  val_batch_size: 16
  return_raw_chat: true
  shuffle: false
  apply_chat_template_kwargs:
    enable_thinking: true

env:
  env_name: awm_agentic_opd
  seed: 0
  max_steps: 20
  history_length: 0
  context:
    history_policy: token_budget
    max_history_exchanges: null
  agentic_eval:
    native_action_protocol: true
    prompt_rendering: chatml
    action_format: tool_call
  validation:
    env_name: tau
  teacher_reward:
    mode: frequency_weighted
    # Weighted mode: 1 + scale * (count - 1) / (teacher_samples - 1).
    frequency_bonus_scale: 0.5
  awm:
    base_url: http://127.0.0.1:8000
    train_max_steps: 20
    eval_max_steps: 20
    eval_seed: 300
    verifier_mode: sql
    reward_mode: semantic
    # Extra fresh-environment attempts for transient WebSocket/MCP reset failures.
    reset_max_retries: 2
    reset_retry_backoff_seconds: 1.0
    terminal_judge:
      enabled: true
      provider: ${env.awm.oracle.provider}
      model: ${env.awm.oracle.model}
      api_base: ${env.awm.oracle.api_base}
      api_key_env: ${env.awm.oracle.api_key_env}
      reasoning_effort: max
      max_tokens: 8192
      timeout_seconds: 300
      max_retries: 5
    runtime_failures:
      enabled: true
      path: runs/awm/runtime_failures.jsonl
      protocol_version: 2
      judge:
        enabled: true
        confidence_threshold: 80
        data_dir: ???
        reference_trials_path: null
        cache_path: runs/awm/cache/runtime_judge.jsonl
        provider: ${env.awm.oracle.provider}
        model: ${env.awm.oracle.model}
        api_base: ${env.awm.oracle.api_base}
        api_key_env: ${env.awm.oracle.api_key_env}
        # Runtime judge only: auto selects low for DeepSeek, max for ZAI.
        reasoning_effort: auto
        max_tokens: 8192
        max_format_retries: 1
    oracle:
      use_privileged_context: false
      # Same-tool, structural-exact + frozen semantic matching of free-text fields.
      # Set false for the original exact-argument reward protocol (both families).
      tool_argument_matcher_enabled: true
      provider: deepseek
      model: deepseek-v4-flash
      api_base: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      samples: 3
      enable_thinking: true
      reasoning_effort: max
      thinking_budget: null
      temperature: null
      top_p: null
      presence_penalty: null
      max_tokens: 4096
      matcher_provider: ${env.awm.oracle.provider}
      matcher_model: ${env.awm.oracle.model}
      matcher_api_base: ${env.awm.oracle.api_base}
      matcher_api_key_env: ${env.awm.oracle.api_key_env}
      # Null decoding overrides retain provider defaults (DeepSeek low/32768).
      matcher_enable_thinking: null
      matcher_reasoning_effort: null
      matcher_max_tokens: null
      matcher_max_concurrent_requests: 32
      cache_path: runs/awm/cache/teacher.jsonl
      teacher_cache_import_paths: []
      # Explicitly opt into audited legacy-prompt seed labels; default is strict.
      # Original generation provenance is retained; raw votes are revalidated.
      teacher_cache_import_prompt_hashes: []
      matcher_cache_path: runs/awm/cache/matcher.jsonl
      timeout_seconds: 300
      max_retries: 5
      # Additional per-vote retries only for parser/schema-invalid actions.
      teacher_validity_max_retries: 2
      max_concurrent_requests: 32
  tau:
    source_root: ???
    train_max_steps: 20
    eval_max_steps: 30
    eval_seed: 300
    user_llm: ???
    user_api_base: ???
    user_api_key_env: TAU_USER_API_KEY
    user_temperature: 1.0
    user_top_p: 0.95
    user_top_k: 20
    user_min_p: 0.0
    user_presence_penalty: 1.5
    user_repetition_penalty: 1.0
    user_max_tokens: 8192
    user_reasoning_enabled: true
    user_generation_retries: 2
    validation_domains:
      - airline
    validation_counts:
      airline: 16
      retail: 0
      telecom: 0
    validation_task_split: base
    validation_trials: 1
  rollout:
    n: 4
    mode: state_group
    selection_mode: best
    random_select_prob: 0.0
    prefer_nonrepeat_argmax: true
    teacher_multi_call_fallback:
      enabled: true
      min_repeat_streak: 2
    repeat_reward_cap:
      enabled: true
      min_streak: 3
      value: 0.0
    repeat_termination:
      enabled: true
      max_streak: 4
  resources_per_worker:
    num_cpus: 0.1
    num_gpus: 0

reward_model:
  reward_manager: turn

actor_rollout_ref:
  actor:
    entropy_coeff: 0.0
    log_entropy_metrics: false
    log_sampled_entropy_metrics: true
    use_invalid_action_penalty: false
  rollout:
    n: 1
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    val_kwargs:
      # Periodic Tau validation uses a greedy agent; the user simulator remains stochastic.
      do_sample: false
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      min_p: 0.0
      n: 1
      seed: 300
    max_model_len: 32000
    max_num_batched_tokens: 32000
    multi_turn:
      enable: true

algorithm:
  adv_estimator: dapo
  state_group:
    advantage_mode: mean_then_batch_whiten
    normalization_scope: batch
    equal_reward_eps: 1.0e-8
    min_candidates: 2
    min_effective_groups: 1
    compact_policy_rows: true
    diagnostic_only: false
  dapo_trajectory_level_advantage: false
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
    metric: acc
    max_num_gen_batches: 10
