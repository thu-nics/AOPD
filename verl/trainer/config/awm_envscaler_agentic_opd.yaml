defaults:
  - awm_agentic_opd
  - _self_

# Conversation-augmented main setting: exactly 58 AWM and 6 EnvScaler
# trajectories in every 64-task agentic OPD batch.
env:
  env_name: awm_envscaler_agentic_opd
  max_steps: 40
  context:
    history_policy: token_budget
    max_history_exchanges: null
  agentic_mix:
    trajectory_counts:
      awm: 58
      envscaler: 6
  envscaler:
    source_root: ???
    train_max_steps: 40
    runtime_failures:
      enabled: true
      judge:
        enabled: true
        confidence_threshold: 80
    oracle:
      use_privileged_context: false
    user_simulator:
      provider: ${env.awm.oracle.provider}
      model: ${env.awm.oracle.model}
      api_base: ${env.awm.oracle.api_base}
      api_key_env: ${env.awm.oracle.api_key_env}
      timeout_seconds: 300
      temperature: 1.0
      reasoning_enabled: null
      max_retries: 3
