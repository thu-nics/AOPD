defaults:
  - awm_agentic_opd
  - _self_

# Conversation-augmented main setting: exactly 58 AWM and 6 EnvScaler
# trajectories in every 64-task agentic OPD batch.
env:
  env_name: awm_envscaler_agentic_opd
  max_steps: 40
  context:
    history_policy: token_budget
    max_history_exchanges: null
  agentic_mix:
    trajectory_counts:
      awm: 58
      envscaler: 6
  envscaler:
    source_root: /mnt/public2/yuanhuining/repos/EnvScaler
    train_max_steps: 40
    oracle:
      use_privileged_context: false
    user_simulator:
      model: deepseek-v4-flash
      api_base: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      timeout_seconds: 300
      temperature: 1.0
      reasoning_enabled: false
      max_retries: 3
