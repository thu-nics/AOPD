defaults:
  - ppo_trainer
  - _self_

# VPR Sudoku — paper-default configuration (9x9 grid, 40 blank cells)
# Inherits all settings from ppo_trainer.yaml; this file overrides env section.

env:
  env_name: vpr_sudoku
  history_length: 0        # VPRBaseEnvironmentManager enforces this at initialization
  max_steps: 100           # Maximum moves per Sudoku episode (at most 81 cells)
  invalid_penalty: -2.0
  sudoku:
    n: 3                   # GEM box size (3 means 9x9 grid)
    clues: 40              # Required number of BLANK cells (paper default: 40 of 81). The
                           # adapter retries GEM generation deterministically until exactly
                           # this many blanks are produced.
    terminate_on_wrong_digit: false
    forced_reward: 2.0
    mrv_reward: 1.0
    legal_non_oracle_reward: 0.5
    wrong_digit_penalty: -1.0
    cell_error_penalty: -2.0
    reward_mode: oracle     # "oracle" (MRV/forced-cell imitation) or "outcome" (win/lose: solve=+1, wrong/invalid=-1)
  rollout:
    mode: vanilla
    selection_mode: best
    random_select_prob: 0.0
  resources_per_worker:
    num_cpus: 0.1
    num_gpus: 0

algorithm:
  adv_estimator: vpr
  vpr:
    outcome_reward_scale: 0.0
    state_group_advantage_mode: group_whiten
