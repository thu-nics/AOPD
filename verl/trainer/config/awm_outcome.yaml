defaults:
  - ppo_trainer
  - _self_

data:
  # 32,000 total context = 27,904 prompt + 4,096 generated action.
  max_prompt_length: 27904
  max_response_length: 4096
  truncation: error
  train_batch_size: 8
  val_batch_size: 8
  return_raw_chat: true
  shuffle: false
  apply_chat_template_kwargs:
    enable_thinking: true

env:
  env_name: awm_outcome
  seed: 0
  max_steps: 20
  history_length: 0
  context:
    history_policy: token_budget
    max_history_exchanges: null
  agentic_eval:
    native_action_protocol: true
    prompt_rendering: chatml
    action_format: tool_call
  validation:
    env_name: awm
  teacher_reward:
    mode: frequency_weighted
    # Weighted mode: 1 + scale * (count - 1) / (teacher_samples - 1).
    frequency_bonus_scale: 0.5
  awm:
    base_url: http://127.0.0.1:8000
    train_max_steps: 20
    eval_max_steps: 20
    eval_seed: 300
    verifier_mode: sql
    reward_mode: outcome
    terminal_judge:
      enabled: true
      model: deepseek-v4-flash
      api_base: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      reasoning_effort: max
      max_tokens: 8192
      timeout_seconds: 300
      max_retries: 5
    # Kept structurally aligned with awm_semantic; outcome never creates this actor.
    oracle:
      model: deepseek-v4-flash
      api_key_env: DEEPSEEK_API_KEY
      samples: 3
      reasoning_effort: max
      max_tokens: 4096
      cache_path: runs/awm/cache/teacher.jsonl
      matcher_cache_path: runs/awm/cache/matcher.jsonl
      timeout_seconds: 300
      max_retries: 5
      max_concurrent_requests: 32
  rollout:
    n: 4
    mode: vanilla
    selection_mode: best
    random_select_prob: 0.0
  resources_per_worker:
    num_cpus: 0.5
    num_gpus: 0

reward_model:
  reward_manager: turn

actor_rollout_ref:
  actor:
    entropy_coeff: 0.0
    log_entropy_metrics: false
    log_sampled_entropy_metrics: true
    use_invalid_action_penalty: false
  rollout:
    n: 1
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    val_kwargs:
      do_sample: true
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      n: 1
      seed: 300
    max_model_len: 32000
    max_num_batched_tokens: 32000
    multi_turn:
      enable: true

algorithm:
  adv_estimator: grpo
  dapo_trajectory_level_advantage: true
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
    metric: acc
    max_num_gen_batches: 10
