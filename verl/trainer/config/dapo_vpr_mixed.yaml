defaults:
  - ppo_trainer
  - _self_

env:
  env_name: dapo_vpr_mixed
  history_length: 0
  max_steps: 40
  invalid_penalty: -2.0
  game_action_format: boxed
  mixed:
    trajectory_counts:
      math: 64
      sokoban: 6
      sudoku: 8
      minesweeper: 18
    validation_counts:
      math: 30
      sokoban: 32
      sudoku: 32
      minesweeper: 32
  sokoban:
    dim_room: [6, 6]
    num_boxes: 2
    max_steps: 24
    # Training-only state-group collection horizon. Null keeps the full episode.
    train_rollout_max_steps: 15
    invalid_penalty: -1.0
    search_depth: 15
    mode: tiny_rgb_array
    reward_mode: oracle
    oracle_reward: 2.0
    legal_non_oracle_reward: 0.0
    reward_noise_prob: 0.0
  sudoku:
    n: 3
    clues: 40
    max_steps: 40
    # Training-only state-group collection horizon. Null keeps the full episode.
    train_rollout_max_steps: 15
    invalid_penalty: -2.0
    terminate_on_wrong_digit: false
    terminate_on_invalid_parse: true
    forced_reward: 2.0
    mrv_reward: 1.0
    legal_non_oracle_reward: 0.5
    wrong_digit_penalty: -1.0
    cell_error_penalty: -2.0
    reward_mode: oracle
  minesweeper:
    rows: 5
    cols: 5
    mines: 4
    max_steps: 15
    invalid_penalty: -2.0
    reward_mode: oracle
    auto_reveal_center: true
    oracle_policy: all_oracle_actions
    oracle_reward: 2.0
    oracle_flag_reward: 1.0
    oracle_guess_reward: 1.0
    non_oracle_penalty: -1.0
    non_oracle_flag_penalty: -1.5
  rollout:
    n: 8
    math_n: 8
    game_n: 4
    mode: state_group
    selection_mode: best
    random_select_prob: 0.0
    random_select_prob_schedule: ""
  resources_per_worker:
    num_cpus: 0.1
    num_gpus: 0

reward_model:
  reward_manager: dapo_turn
  overlong_buffer:
    enable: true
    len: 4096
    penalty_factor: 1.0
    log: true

actor_rollout_ref:
  actor:
    use_invalid_action_penalty: false

algorithm:
  adv_estimator: dapo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: true
    metric: acc
    max_num_gen_batches: 10
