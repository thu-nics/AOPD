defaults:
  - ppo_trainer
  - _self_

# VPR TicTacToe — paper-default configuration
# Inherits all settings from ppo_trainer.yaml; this file overrides env section.

env:
  env_name: vpr_tictactoe
  history_length: 0        # VPRBaseEnvironmentManager enforces this at initialization
  max_steps: 9             # Maximum moves per TicTacToe episode (3x3 board)
  invalid_penalty: -1.0
  tictactoe:
    opponent: random       # "random" or "mcts" (mcts needs: pip install open_spiel)
    agent_player: X         # mark the policy model controls: "X" (first) or "O" (second)
    reward_mode: oracle     # "oracle" (dense per-step, VPR) or "outcome" (win/lose, GRPO baseline)
    mcts:                   # used only when opponent: mcts (OpenSpiel C++ MCTS)
      max_simulations: 100
      uct_c: 2.0
      rollout_count: 10
  resources_per_worker:
    num_cpus: 0.1
    num_gpus: 0

algorithm:
  adv_estimator: vpr
  vpr:
    outcome_reward_scale: 0.0
    state_group_advantage_mode: group_whiten
