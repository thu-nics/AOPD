defaults:
  - ppo_trainer
  - _self_

env:
  env_name: tau_agentic_opd
  seed: 0
  max_steps: 30
  history_length: 0
  agentic_eval:
    native_action_protocol: true
    prompt_rendering: chatml
    action_format: tool_call
  teacher_reward:
    mode: frequency_weighted
    # Weighted mode: 1 + scale * (count - 1) / (teacher_samples - 1).
    frequency_bonus_scale: 0.5
  tau:
    source_root: ???
    train_max_steps: 20
    eval_max_steps: 30
    eval_seed: 300
    user_llm: ???
    user_api_base: ???
    user_api_key_env: TAU_USER_API_KEY
    user_temperature: 1.0
    user_top_p: 0.95
    user_top_k: 20
    user_min_p: 0.0
    user_presence_penalty: 1.5
    user_repetition_penalty: 1.0
    user_max_tokens: 8192
    user_reasoning_enabled: true
    user_generation_retries: 2
    # Tau INFO/DEBUG records include complete per-turn message objects.
    native_log_level: WARNING
    trajectory_counts:
      airline: 5
      retail: 11
    validation_domains:
      - airline
      - retail
    validation_counts:
      airline: 5
      retail: 11
    validation_task_split: test
    validation_trials: 1
    oracle:
      use_privileged_context: false
      model: ???
      api_base: ???
      api_key_env: TAU_TEACHER_API_KEY
      samples: 3
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      enable_thinking: true
      max_tokens: 8192
      cache_path: ???
      matcher_cache_path: ???
      timeout_seconds: 180
      max_retries: 5
      teacher_validity_max_retries: 2
      max_concurrent_requests: 24
  rollout:
    n: 4
    mode: state_group
    selection_mode: best
    random_select_prob: 0.0
  resources_per_worker:
    num_cpus: 0.5
    num_gpus: 0

reward_model:
  # Keep optimizer/reward-manager semantics matched to AWM/EnvScaler Agentic OPD.
  reward_manager: turn
  overlong_buffer:
    enable: false
    len: 2048
    penalty_factor: 1.0
    log: true

actor_rollout_ref:
  actor:
    entropy_coeff: 0.0
    log_entropy_metrics: false
    log_sampled_entropy_metrics: true
    use_invalid_action_penalty: false
  rollout:
    val_kwargs:
      do_sample: false
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      min_p: 0.0
      n: 1
      seed: 300

algorithm:
  adv_estimator: dapo
  state_group:
    advantage_mode: mean_then_batch_whiten
    normalization_scope: batch
    equal_reward_eps: 1.0e-8
    min_candidates: 2
    min_effective_groups: 1
    compact_policy_rows: true
  # Agentic OPD normalizes the four candidates at each state, not full trajectories.
  dapo_trajectory_level_advantage: false
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
    metric: acc
    max_num_gen_batches: 10
